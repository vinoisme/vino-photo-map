<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root {
  --deep:#203940; --green:#667D78; --soft:#F3F2ED; --card:#FFFFFF; --line:#D4D8D5;
  --text:#29383C; --muted:#758086; --blue:#5E7F7C; --warn:#8B6F47;
}
* { box-sizing:border-box; }
html, body { width:100%; height:100%; }
body { margin:0; font-family:"Microsoft JhengHei","Noto Sans TC",Arial,sans-serif; background:#ECEFEB; color:var(--text); }
.app { display:grid; grid-template-columns:360px 1fr; height:100vh; gap:0; }
.sidebar { padding:22px; background:rgba(255,255,255,.94); border-right:1px solid var(--line); overflow:auto; z-index:10; }
.brand { display:flex; align-items:center; gap:12px; margin-bottom:14px; }
.logo { width:48px; height:48px; border-radius:12px; background:#E5E9E5; display:grid; place-items:center; font-size:26px; }
h1 { margin:0; color:var(--deep); font-size:24px; line-height:1.2; }
.tool-name { color:var(--green); font-size:15px; font-weight:800; margin-top:4px; }
.subtitle { color:var(--muted); font-size:12px; margin-top:5px; line-height:1.5; }
.project-badge { margin:10px 0 2px; padding:8px 10px; border:1px solid var(--line); border-radius:12px; background:var(--soft); font-size:12px; color:var(--text); word-break:break-all; }
.stats { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:14px 0; }
.stat { background:var(--soft); border:1px solid var(--line); border-radius:18px; padding:12px; }
.stat b { font-size:22px; color:var(--deep); }
.stat small { display:block; color:var(--muted); margin-top:2px; }
.map-summary { margin:10px 0 12px; padding:9px 10px; border:1px solid var(--line); border-radius:12px; background:#FAFAF7; font-size:11px; color:var(--muted); line-height:1.55; }
.map-summary b { color:var(--deep); }
.photo-row { width:100%; display:flex; gap:10px; align-items:flex-start; text-align:left; padding:11px 10px; margin:8px 0; border:1px solid var(--line); border-radius:16px; background:#fff; cursor:pointer; transition:.15s; color:var(--text); }
.photo-row:hover { transform:translateY(-1px); box-shadow:0 8px 20px rgba(11,31,51,.12); border-color:#AAB8B3; }
.row-index { flex:0 0 28px; height:28px; border-radius:50%; background:var(--green); color:#fff; display:grid; place-items:center; font-weight:700; }
.row-main b { display:block; font-size:13px; word-break:break-all; }
.row-main small { display:block; color:var(--muted); margin-top:4px; font-size:11px; line-height:1.35; }
.map-stage { position:relative; min-width:0; height:100vh; background:#D8D9D5; overflow:hidden; }
.map-engine { position:absolute; inset:0; width:100%; height:100%; }
#google-map { display:none; }
.map-switcher { position:absolute; z-index:1000; top:14px; right:14px; width:min(310px, calc(100% - 28px)); }
.basemap-toggle-btn { display:none; border:0; border-radius:999px; background:rgba(32,57,64,.94); color:#fff; font-family:inherit; font-weight:800; font-size:13px; padding:10px 14px; box-shadow:0 4px 14px rgba(0,0,0,.22); cursor:pointer; }
.map-switcher-panel { background:rgba(255,255,255,.96); border:1px solid #BFC7C3; border-radius:12px; padding:10px; box-shadow:0 4px 18px rgba(25,45,49,.14); }
.map-switcher label { display:block; font-size:12px; font-weight:800; color:var(--deep); margin-bottom:5px; }
.map-switcher select { width:100%; border:1px solid #C8D0CC; border-radius:8px; background:#fff; color:var(--text); padding:7px 8px; font-family:inherit; font-size:12px; }
.switch-row { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:7px; }
.switch-row label { margin:0; font-weight:500; color:var(--muted); }
#active-map-name { font-size:11px; color:var(--green); font-weight:800; }
.mobile-list-toggle { display:none; border:0; border-radius:999px; background:var(--deep); color:#fff; font-family:inherit; font-weight:800; font-size:12px; padding:8px 12px; cursor:pointer; flex:0 0 auto; }
#map-message { display:none; position:absolute; z-index:1100; top:116px; right:14px; max-width:360px; background:rgba(255,252,243,.97); color:#6E5737; border:1px solid #D8C8AA; border-radius:10px; padding:9px 11px; font-size:12px; box-shadow:0 3px 12px rgba(0,0,0,.1); }
.popup-card { width:310px; }
.popup-title { font-weight:800; color:var(--deep); font-size:15px; margin-bottom:6px; word-break:break-all; }
.popup-meta { font-size:12px; color:var(--text); margin:3px 0; }
.popup-photo { width:100%; max-height:360px; object-fit:contain; border-radius:12px; margin:8px 0; background:#F4F2ED; }
.popup-coord { font-size:11px; color:var(--muted); margin:5px 0; }
.map-link { display:inline-block; margin-top:6px; color:#fff !important; background:var(--blue); text-decoration:none; padding:7px 10px; border-radius:10px; font-weight:700; }
.target-ipad .photo-row, .target-android .photo-row { min-height:54px; }
.target-ipad .map-switcher select, .target-android .map-switcher select { min-height:38px; }
.target-ipad .map-link, .target-android .map-link { display:inline-block; padding:9px 12px; }
/* 手機 / 平板 / 觸控裝置：不論直式、橫式，都切換成「地圖優先」精簡介面。
   另外涵蓋橫式手機瀏覽器因 CSS viewport 較寬而未命中 900px 的情況。 */
@media (max-width:900px), (hover:none) and (pointer:coarse), (orientation:landscape) and (max-height:720px) {
  html, body { height:100%; overflow:hidden; overscroll-behavior:none; }
  body { background:#D8D9D5; }
  .app { display:block; width:100%; height:100dvh; min-height:100dvh; overflow:hidden; }
  .map-stage { position:fixed; inset:0; width:100vw; height:100dvh; min-height:100dvh; z-index:1; }

  /* 行動版上方只保留一條精簡工具列，讓地圖幾乎吃滿整個畫面。 */
  .sidebar {
    position:fixed; z-index:1300; top:max(4px, env(safe-area-inset-top)); left:5px; right:5px;
    width:auto; height:44px; padding:5px 7px; overflow:visible;
    border:1px solid rgba(190,199,195,.88); border-radius:11px;
    background:rgba(255,255,255,.90); box-shadow:0 3px 12px rgba(20,38,43,.13);
    backdrop-filter:blur(9px); -webkit-backdrop-filter:blur(9px);
  }
  .brand { margin:0; gap:7px; min-width:0; height:32px; align-items:center; padding-right:228px; }
  .brand > div:last-child { min-width:0; flex:1; }
  .logo { width:30px; height:30px; border-radius:8px; font-size:17px; flex:0 0 30px; }
  h1 { font-size:14px; line-height:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tool-name { display:none !important; }
  /* 手機 / 平板不再顯示橘框中的專案名稱、統計卡、說明與底圖摘要。 */
  .project-badge, .stats, .subtitle, .map-summary { display:none !important; }
  .mobile-list-toggle { display:block; position:absolute; right:7px; top:6px; min-height:32px; padding:6px 9px; font-size:11px; }

  /* 照片清單改為需要時才彈出的抽屜，不再永久吃掉地圖高度。 */
  .photo-list { display:none; position:fixed; z-index:1310; top:52px; left:7px; right:7px; max-height:68dvh; overflow:auto; padding:7px; background:rgba(255,255,255,.98); border:1px solid var(--line); border-radius:12px; box-shadow:0 12px 30px rgba(0,0,0,.22); }
  .sidebar.mobile-open .photo-list { display:block; }
  .photo-row { margin:5px 0; padding:9px 8px; min-height:48px; }

  /* 行動版底圖直接用小型下拉選單，不再使用會遮住地圖的大型彈出面板。 */
  .map-switcher { position:fixed; top:max(10px, calc(env(safe-area-inset-top) + 6px)); right:82px; bottom:auto; width:138px; z-index:1405; }
  .basemap-toggle-btn { display:none !important; }
  .map-switcher-panel {
    display:block !important; position:static; width:138px; padding:0; border:0; border-radius:9px;
    background:transparent; box-shadow:none;
  }
  .map-switcher-panel > label, .switch-row { display:none !important; }
  .map-switcher select {
    width:138px; min-height:32px; height:32px; padding:4px 26px 4px 7px; font-size:11px; font-weight:700;
    border-radius:9px; border:1px solid rgba(180,190,186,.95); background:rgba(255,255,255,.96);
    box-shadow:0 2px 8px rgba(20,38,43,.10);
  }
  #active-map-name { display:none; }
  #map-message { top:auto; bottom:70px; left:12px; right:12px; max-width:none; font-size:11px; }

  /* 避免 Leaflet 左上角縮放鍵被精簡工具列蓋住。 */
  .leaflet-top.leaflet-left { top:48px; }
  .leaflet-control-attribution { font-size:9px !important; max-width:64vw; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .popup-card { width:min(300px, 76vw); }
}
@media (max-width:520px) {
  .brand { padding-right:218px; }
  h1 { font-size:13px; }
  .map-switcher { right:78px; width:132px; }
  .map-switcher-panel, .map-switcher select { width:132px; }
  .photo-list { top:51px; max-height:72dvh; }
}
@media (orientation:landscape) and (max-height:720px) {
  .sidebar { top:max(2px, env(safe-area-inset-top)); left:max(4px, env(safe-area-inset-left)); right:max(4px, env(safe-area-inset-right)); height:38px; padding:3px 6px; border-radius:9px; }
  .brand { height:30px; padding-right:222px; }
  .logo { width:27px; height:27px; flex-basis:27px; font-size:15px; }
  h1 { font-size:12px; }
  .mobile-list-toggle { top:3px; right:5px; min-height:30px; height:30px; padding:4px 8px; }
  .map-switcher { top:max(5px, calc(env(safe-area-inset-top) + 3px)); right:78px; width:136px; }
  .map-switcher-panel, .map-switcher select { width:136px; }
  .map-switcher select { height:30px; min-height:30px; font-size:10px; }
  .photo-list { top:43px; max-height:80dvh; }
  .leaflet-top.leaflet-left { top:40px; }
  #map-message { bottom:48px; }
}
</style>

 class='popup-meta'>拍攝日期：2026-08-21 13:57:05<\/div>\n              <div class='popup-meta'>相機型號：Apple iPhone 17 Pro Max<\/div>\n              <img class=\"popup-photo\" src=\"photos/p0250.jpg\" alt=\"IMG_4648.JPEG\" />\n              <div class='popup-coord'>座標：24.01811667, 120.68179444<\/div>\n              <a class='map-link' target='_blank' href='https://maps.google.com/maps?q=24.018116666666664,120.68179444444445'>用 Google Maps 開啟<\/a>\n            <\/div>"}, {"index": 251, "lat": 24.018119444444444, "lng": 120.68179444444445, "title": "IMG_4649.JPEG", "popup": "<div class='popup-card'>\n              <div class='popup-title'>IMG_4649.JPEG<\/div>\n              <div class='popup-meta'>拍攝日期：2026-08-21 13:57:07<\/div>\n              <div class='popup-meta'>相機型號：Apple iPhone 17 Pro Max<\/div>\n              <img class=\"popup-photo\" src=\"photos/p0251.jpg\" alt=\"IMG_4649.JPEG\" />\n              <div class='popup-coord'>座標：24.01811944, 120.68179444<\/div>\n              <a class='map-link' target='_blank' href='https://maps.google.com/maps?q=24.018119444444444,120.68179444444445'>用 Google Maps 開啟<\/a>\n            <\/div>"}, {"index": 252, "lat": 24.018108333333334, "lng": 120.68179444444445, "title": "IMG_4650.JPEG", "popup": "<div class='popup-card'>\n              <div class='popup-title'>IMG_4650.JPEG<\/div>\n              <div class='popup-meta'>拍攝日期：2026-08-21 13:57:09<\/div>\n              <div class='popup-meta'>相機型號：Apple iPhone 17 Pro Max<\/div>\n              <img class=\"popup-photo\" src=\"photos/p0252.jpg\" alt=\"IMG_4650.JPEG\" />\n              <div class='popup-coord'>座標：24.01810833, 120.68179444<\/div>\n              <a class='map-link' target='_blank' href='https://maps.google.com/maps?q=24.018108333333334,120.68179444444445'>用 Google Maps 開啟<\/a>\n            <\/div>"}, {"index": 253, "lat": 24.018105555555554, "lng": 120.68180000000001, "title": "IMG_4651.JPEG", "popup": "<div class='popup-card'>\n              <div class='popup-title'>IMG_4651.JPEG<\/div>\n              <div class='popup-meta'>拍攝日期：2026-08-21 13:57:11<\/div>\n              <div class='popup-meta'>相機型號：Apple iPhone 17 Pro Max<\/div>\n              <img class=\"popup-photo\" src=\"photos/p0253.jpg\" alt=\"IMG_4651.JPEG\" />\n              <div class='popup-coord'>座標：24.01810556, 120.68180000<\/div>\n              <a class='map-link' target='_blank' href='https://maps.google.com/maps?q=24.018105555555554,120.68180000000001'>用 Google Maps 開啟<\/a>\n            <\/div>"}];
const GOOGLE_ENABLED = true;
const DEFAULT_PROVIDER = "google_satellite";
const MOBILE_FALLBACK_PROVIDER = "nlsc";
const HTML_OUTPUT_MODE = "cloud";
const PROVIDER_LABELS = {
  osm: 'OpenStreetMap 街道圖',
  google_road: 'Google 街道圖',
  esri: 'Esri World Imagery 衛星圖',
  google_satellite: 'Google 衛星圖',
  nlsc: 'NLSC 正射影像'
};

const leafletDiv = document.getElementById('leaflet-map');
const googleDiv = document.getElementById('google-map');
const basemapSelect = document.getElementById('basemap-select');
const labelsToggle = document.getElementById('labels-toggle');
const activeMapName = document.getElementById('active-map-name');
const mapMessage = document.getElementById('map-message');
const mapSwitcher = document.getElementById('map-switcher');
const basemapToggleBtn = document.getElementById('basemap-toggle-btn');
const mobileListToggle = document.getElementById('mobile-list-toggle');
const sidebar = document.querySelector('.sidebar');

function isCompactDevice() {
  return window.matchMedia('(hover:none) and (pointer:coarse)').matches ||
         window.innerWidth <= 900 ||
         (window.matchMedia('(orientation:landscape)').matches && window.innerHeight <= 720);
}

function showMessage(text, ms=5000) {
  mapMessage.textContent = text;
  mapMessage.style.display = 'block';
  window.clearTimeout(showMessage._timer);
  if (ms > 0) showMessage._timer = window.setTimeout(() => mapMessage.style.display = 'none', ms);
}

const MAX_DETAIL_ZOOM = 25;
const FOCUS_ZOOM = 23;
const leafletMap = L.map('leaflet-map', {maxZoom:MAX_DETAIL_ZOOM, zoomControl:true, zoomSnap:0.25, wheelPxPerZoomLevel:45}).setView([24.01981718269653, 120.68106019982434], 18);
const osmLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxNativeZoom:19, maxZoom:MAX_DETAIL_ZOOM, attribution:'&copy; OpenStreetMap contributors'
});
const esriLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
  maxNativeZoom:19, maxZoom:MAX_DETAIL_ZOOM, attribution:'Tiles &copy; Esri'
});
const esriLabelsLayer = L.tileLayer('https://services.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', {
  maxNativeZoom:19, maxZoom:MAX_DETAIL_ZOOM, attribution:'Labels &copy; Esri'
});
const nlscLayer = L.tileLayer('https://wmts.nlsc.gov.tw/wmts/PHOTO2/default/GoogleMapsCompatible/{z}/{y}/{x}', {
  maxNativeZoom:19, maxZoom:MAX_DETAIL_ZOOM, attribution:'&copy; 內政部國土測繪中心 NLSC'
});
const leafletBaseLayers = {osm: osmLayer, esri: esriLayer, nlsc: nlscLayer};
let activeLeafletLayer = null;
const leafletMarkers = [];
const leafletBounds = [];
POINTS.forEach((p) => {
  const marker = L.marker([p.lat, p.lng]).addTo(leafletMap).bindPopup(p.popup);
  marker.on('popupopen', scheduleLeafletPopupAutoClose);
  marker.on('popupclose', clearPopupAutoCloseTimer);
  leafletMarkers.push(marker);
  leafletBounds.push([p.lat, p.lng]);
});
if (leafletBounds.length > 1) leafletMap.fitBounds(leafletBounds, {padding:[40,40], maxZoom:19});

let activeProvider = 'esri';
let googleApiReady = false;
let googleMap = null;
let googleMarkers = [];
let googleInfoWindows = [];
let pendingGoogleProvider = null;
let googleLoadTimer = null;
let popupAutoCloseTimer = null;
const POPUP_AUTO_CLOSE_MS = 6000;

function clearPopupAutoCloseTimer() {
  if (popupAutoCloseTimer) {
    window.clearTimeout(popupAutoCloseTimer);
    popupAutoCloseTimer = null;
  }
}
function scheduleLeafletPopupAutoClose() {
  clearPopupAutoCloseTimer();
  popupAutoCloseTimer = window.setTimeout(() => {
    try { leafletMap.closePopup(); } catch (e) {}
    popupAutoCloseTimer = null;
  }, POPUP_AUTO_CLOSE_MS);
}
function scheduleGoogleInfoAutoClose(info) {
  clearPopupAutoCloseTimer();
  popupAutoCloseTimer = window.setTimeout(() => {
    try { if (info) info.close(); } catch (e) {}
    popupAutoCloseTimer = null;
  }, POPUP_AUTO_CLOSE_MS);
}

function currentLeafletView() {
  const c = leafletMap.getCenter();
  return {lat:c.lat, lng:c.lng, zoom:leafletMap.getZoom()};
}
function currentGoogleView() {
  if (!googleMap) return {lat:24.01981718269653, lng:120.68106019982434, zoom:18};
  const c = googleMap.getCenter();
  return {lat:c.lat(), lng:c.lng(), zoom:googleMap.getZoom() || 18};
}
function updateActiveLabel() {
  activeMapName.textContent = PROVIDER_LABELS[activeProvider] || activeProvider;
}
function syncLabelsOverlay() {
  const shouldShow = labelsToggle.checked && activeProvider === 'esri';
  if (shouldShow && !leafletMap.hasLayer(esriLabelsLayer)) esriLabelsLayer.addTo(leafletMap);
  if (!shouldShow && leafletMap.hasLayer(esriLabelsLayer)) leafletMap.removeLayer(esriLabelsLayer);
  labelsToggle.disabled = (activeProvider !== 'esri');
}
function removeActiveLeafletLayer() {
  if (activeLeafletLayer && leafletMap.hasLayer(activeLeafletLayer)) leafletMap.removeLayer(activeLeafletLayer);
}
function switchToLeaflet(provider) {
  let view = currentLeafletView();
  if (activeProvider === 'google_road' || activeProvider === 'google_satellite') view = currentGoogleView();
  googleDiv.style.display = 'none';
  leafletDiv.style.display = 'block';
  removeActiveLeafletLayer();
  activeLeafletLayer = leafletBaseLayers[provider] || esriLayer;
  activeLeafletLayer.addTo(leafletMap);
  activeProvider = provider;
  leafletMap.setView([view.lat, view.lng], Math.min(MAX_DETAIL_ZOOM, view.zoom));
  window.setTimeout(() => leafletMap.invalidateSize(), 0);
  syncLabelsOverlay();
  updateActiveLabel();
}

function ensureGoogleMap(provider) {
  if (!googleApiReady || !window.google || !google.maps) return false;
  const fromLeaflet = currentLeafletView();
  if (!googleMap) {
    googleMap = new google.maps.Map(googleDiv, {
      center: {lat:fromLeaflet.lat, lng:fromLeaflet.lng},
      zoom: fromLeaflet.zoom,
      mapTypeId: provider === 'google_satellite' ? 'satellite' : 'roadmap',
      mapTypeControl:false,
      maxZoom:23,
      streetViewControl:true,
      fullscreenControl:true
    });
    const bounds = new google.maps.LatLngBounds();
    POINTS.forEach((p) => {
      const marker = new google.maps.Marker({position:{lat:p.lat,lng:p.lng}, map:googleMap, title:p.title});
      const info = new google.maps.InfoWindow({content:p.popup});
      marker.addListener('click', () => {
        // 同一時間只保留一個資訊視窗，並在 6 秒後自動關閉。
        googleInfoWindows.forEach((w) => { try { if (w !== info) w.close(); } catch (e) {} });
        info.open({anchor:marker, map:googleMap});
        scheduleGoogleInfoAutoClose(info);
      });
      info.addListener('closeclick', clearPopupAutoCloseTimer);
      googleMarkers.push(marker);
      googleInfoWindows.push(info);
      bounds.extend(marker.getPosition());
    });
  }
  return true;
}
function fallbackFromGoogle(reason) {
  pendingGoogleProvider = null;
  if (googleLoadTimer) { window.clearTimeout(googleLoadTimer); googleLoadTimer = null; }
  const fallback = MOBILE_FALLBACK_PROVIDER || 'esri';
  basemapSelect.value = fallback;
  switchToLeaflet(fallback);
  showMessage(reason + ' 已自動切換到 ' + (PROVIDER_LABELS[fallback] || fallback) + '。', 9000);
}

function switchToGoogle(provider) {
  if (!GOOGLE_ENABLED) {
    fallbackFromGoogle('此 HTML 未寫入 Google Maps Platform API Key，Google 底圖無法載入。');
    return;
  }
  if (!googleApiReady) {
    pendingGoogleProvider = provider;
    showMessage('Google Maps API 載入中，完成後會自動切換；若行動裝置 file:// 驗證失敗，10 秒後會自動回退。', 0);
    if (googleLoadTimer) window.clearTimeout(googleLoadTimer);
    googleLoadTimer = window.setTimeout(() => {
      if (!googleApiReady && pendingGoogleProvider) {
        fallbackFromGoogle('Google Maps API 載入逾時或被行動瀏覽器／API Key 限制阻擋。');
      }
    }, 10000);
    return;
  }
  const view = currentLeafletView();
  if (!ensureGoogleMap(provider)) return;
  leafletDiv.style.display = 'none';
  googleDiv.style.display = 'block';
  googleMap.setMapTypeId(provider === 'google_satellite' ? 'satellite' : 'roadmap');
  googleMap.setCenter({lat:view.lat, lng:view.lng});
  googleMap.setZoom(Math.min(23, view.zoom));
  activeProvider = provider;
  labelsToggle.disabled = true;
  if (leafletMap.hasLayer(esriLabelsLayer)) leafletMap.removeLayer(esriLabelsLayer);
  mapMessage.style.display = 'none';
  updateActiveLabel();
}
function switchBasemap(provider) {
  if (provider === 'google_road' || provider === 'google_satellite') switchToGoogle(provider);
  else switchToLeaflet(provider);
}

window.initGoogleMapsApi = function() {
  googleApiReady = true;
  if (googleLoadTimer) { window.clearTimeout(googleLoadTimer); googleLoadTimer = null; }
  if (pendingGoogleProvider) {
    const p = pendingGoogleProvider;
    pendingGoogleProvider = null;
    switchToGoogle(p);
  }
};
window.gm_authFailure = function() {
  googleApiReady = false;
  fallbackFromGoogle('Google Maps API 驗證失敗；請檢查 API Key、Maps JavaScript API 與金鑰限制設定。');
};

if (basemapToggleBtn) {
  basemapToggleBtn.addEventListener('click', (ev) => {
    ev.stopPropagation();
    if (mapSwitcher) mapSwitcher.classList.toggle('open');
  });
}
if (mobileListToggle) {
  mobileListToggle.addEventListener('click', (ev) => {
    ev.stopPropagation();
    if (sidebar) sidebar.classList.toggle('mobile-open');
    if (mapSwitcher) mapSwitcher.classList.remove('open');
  });
}
document.addEventListener('click', (ev) => {
  if (isCompactDevice()) {
    if (mapSwitcher && !mapSwitcher.contains(ev.target)) mapSwitcher.classList.remove('open');
    if (sidebar && !sidebar.contains(ev.target)) sidebar.classList.remove('mobile-open');
  }
});

basemapSelect.addEventListener('change', () => {
  switchBasemap(basemapSelect.value);
  if (isCompactDevice() && mapSwitcher) mapSwitcher.classList.remove('open');
});
labelsToggle.addEventListener('change', syncLabelsOverlay);
document.querySelectorAll('.photo-row').forEach((btn) => {
  btn.addEventListener('click', () => {
    const idx = Number(btn.dataset.index) - 1;
    const lat = Number(btn.dataset.lat), lng = Number(btn.dataset.lng);
    if (activeProvider === 'google_road' || activeProvider === 'google_satellite') {
      if (!googleMap || !googleMarkers[idx]) return;
      googleMap.setCenter({lat:lat,lng:lng});
      googleMap.setZoom(Math.min(23, FOCUS_ZOOM));
      google.maps.event.trigger(googleMarkers[idx], 'click');
    } else {
      leafletMap.setView([lat,lng], FOCUS_ZOOM);
      if (leafletMarkers[idx]) leafletMarkers[idx].openPopup();
    }
    if (isCompactDevice() && sidebar) sidebar.classList.remove('mobile-open');
  });
});

window.addEventListener('orientationchange', () => {
  window.setTimeout(() => {
    try { leafletMap.invalidateSize(); } catch (e) {}
    if (googleMap && window.google && google.maps) google.maps.event.trigger(googleMap, 'resize');
  }, 250);
});
window.addEventListener('resize', () => {
  window.setTimeout(() => { try { leafletMap.invalidateSize(); } catch (e) {} }, 80);
});

// 初始底圖；若預設 Google 但沒有 Key，自動退回 Esri。
let initialProvider = DEFAULT_PROVIDER;
if ((initialProvider === 'google_road' || initialProvider === 'google_satellite') && !GOOGLE_ENABLED) initialProvider = MOBILE_FALLBACK_PROVIDER || 'esri';
basemapSelect.value = initialProvider;
switchBasemap(initialProvider);
</script>
<script async src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDRI1Pwr_g8VwywvfQVvDUepCR3fWseN0w&loading=async&callback=initGoogleMapsApi&v=weekly&language=zh-TW&region=TW"></script>
